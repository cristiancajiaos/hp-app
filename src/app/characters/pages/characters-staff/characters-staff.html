<section class="characters-staff">
  @if (charactersStaff.isLoading()) {
    <app-loading />
  }
  @if (charactersStaff.hasValue()) {
    <h1 class="text-3xl font-bold flex items-center mb-3">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="1em"
        height="1em"
        class="mr-2"
        viewBox="0 0 24 24"
      >
        <path d="M0 0h24v24H0z" fill="none" />
        <path
          fill="currentColor"
          d="M20 17a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H9.46c.35.61.54 1.3.54 2h10v11h-9v2m4-10v2H9v13H7v-6H5v6H3v-8H1.5V9a2 2 0 0 1 2-2zM8 4a2 2 0 0 1-2 2a2 2 0 0 1-2-2a2 2 0 0 1 2-2a2 2 0 0 1 2 2"
        />
      </svg>
      <span>Hogwarts Staff</span>
    </h1>
    <app-character-results [characters]="charactersStaff.value()" />
  }
</section>
